<!doctype html><html><body style="margin:0;background:transparent">

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const r = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
r.setClearColor(0x000000,0); r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(1,2,1.5); scene.add(key);
const rim = new THREE.DirectionalLight(0xddeeff, 0); rim.position.set(-1.5,1,-2); scene.add(rim);
const cam = new THREE.PerspectiveCamera(30,1,0.01,100);
const cache = {}; const root = new THREE.Group(); scene.add(root);
async function get(url){ if(!cache[url]){ const g = await new GLTFLoader().loadAsync(url); const o=g.scene;
  const box=new THREE.Box3().setFromObject(o); const c=box.getCenter(new THREE.Vector3()); o.position.set(-c.x,-box.min.y,-c.z);
  const p=new THREE.Group(); p.add(o); p.userData.size=box.getSize(new THREE.Vector3()); cache[url]=p;} return cache[url]; }
// items: [{url, x, z, yaw, scale}] ; view: {yaw,pitch,fill,exposure,rim,w,h}
window.shot = async (items, v) => {
  r.setSize(v.w, v.h); cam.aspect = v.w/v.h; cam.updateProjectionMatrix();
  r.toneMappingExposure = v.exposure ?? 1.1; rim.intensity = v.rim ?? 0;
  root.clear();
  for (const it of items){ const o = await get(it.url); const s = it.scale ?? 1/o.userData.size.y*0.15;
    o.scale.setScalar(s); o.rotation.y = THREE.MathUtils.degToRad(it.yaw||0); o.position.set(it.x||0,0,it.z||0); root.add(o); }
  const box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3());
  const sph = box.getBoundingSphere(new THREE.Sphere());
  const fov = THREE.MathUtils.degToRad(cam.fov/2); const fovx = Math.atan(Math.tan(fov)*cam.aspect);
  const d = sph.radius / Math.sin(Math.min(fov,fovx)) / (v.fill ?? 0.95);
  const y = THREE.MathUtils.degToRad(v.yaw||0), p = THREE.MathUtils.degToRad(v.pitch||15);
  cam.position.set(c.x+d*Math.cos(p)*Math.sin(y), c.y+d*Math.sin(p), c.z+d*Math.cos(p)*Math.cos(y)); cam.lookAt(c);
  r.render(scene, cam); return r.domElement.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
