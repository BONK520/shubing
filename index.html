<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#86b4d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="用自己 3D 掃描的毛絨玩具玩的三消小遊戲">
<title>毛絨消消樂</title>
<link rel="icon" href="assets/sprites/sloth.png">
<link rel="apple-touch-icon" href="assets/sprites/sloth.png">
<link rel="stylesheet" href="style.css?v=20261123f">
</head>
<body>

<!-- 共用小圖示 -->
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbd2"/>
      <stop offset=".34" stop-color="#ffe066"/>
      <stop offset=".66" stop-color="#ffc21f"/>
      <stop offset="1" stop-color="#f39508"/>
    </linearGradient>
    <linearGradient id="g-star-off" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeee9"/>
      <stop offset=".45" stop-color="#e3c3c3"/>
      <stop offset="1" stop-color="#b98b92"/>
    </linearGradient>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.6l2.75 5.6 6.15.9-4.45 4.35 1.05 6.13L12 16.68l-5.5 2.9 1.05-6.13L3.1 9.1l6.15-.9z"/></symbol>
    <symbol id="i-star-hi" viewBox="0 0 24 24"><ellipse cx="9.6" cy="9.9" rx="2.5" ry="1.15" transform="rotate(-32 9.6 9.9)"/><circle cx="12.3" cy="6.9" r=".85"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.6"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.6" fill="none" stroke="currentColor" stroke-width="4.4" stroke-dasharray="2.98 2.99"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="3.4"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-hanger" viewBox="0 0 24 24"><path d="M12 7.2a2.2 2.2 0 1 1 2.2-2.2c0 1.2-1 1.6-1.6 2.1-.4.3-.6.6-.6 1.1v.6l8.2 5.6c1 .7.5 2.2-.7 2.2H4.5c-1.2 0-1.7-1.5-.7-2.2L12 8.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M8 11V8.2a4 4 0 0 1 8 0V11" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><rect x="5" y="10.5" width="14" height="10" rx="3"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3.5 9.2h3.8L12 5.3v13.4l-4.7-3.9H3.5z"/><path d="M15.3 9a4.2 4.2 0 0 1 0 6M17.8 6.4a8 8 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><ellipse cx="6.6" cy="17.6" rx="3.1" ry="2.5"/><ellipse cx="16.6" cy="15.4" rx="3.1" ry="2.5"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2.8l8.2 4.6v9.2L12 21.2l-8.2-4.6V7.4z M3.8 7.4L12 12l8.2-4.6 M12 12v9.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.2 19.2a4.7 4.7 0 0 1-.6-9.37 6 6 0 0 1 11.4 1.4 4 4 0 0 1-.5 7.97z"/></symbol>
  </defs>
</svg>

<!-- 背景：天空、光點、雲 -->
<div class="sky" aria-hidden="true">
  <i class="bk b1"></i><i class="bk b2"></i><i class="bk b3"></i><i class="bk b4"></i><i class="bk b5"></i><i class="bk b6"></i>
  <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>
  <!-- 極淡的漂浮光點（慢慢飄、一閃一閃）：只用 transform / opacity 動畫，交給 GPU，不吃主執行緒 -->
  <i class="mote m1"></i><i class="mote m2"></i><i class="mote m3"></i><i class="mote m4"></i><i class="mote m5"></i>
  <i class="mote m6"></i><i class="mote m7"></i><i class="mote m8"></i><i class="mote m9"></i><i class="mote m10"></i>
</div>

<div id="app">

  <!-- 載入中 -->
  <section id="scr-loading" class="screen active" aria-label="載入中">
    <div class="load-wrap">
      <h1 class="logo logo-sm" aria-label="毛絨消消樂"><span class="logo-row" aria-hidden="true"><span class="ch" data-ch="毛" style="--i:0"><b>毛</b></span><span class="ch" data-ch="絨" style="--i:1"><b>絨</b></span><span class="ch" data-ch="消" style="--i:2"><b>消</b></span><span class="ch" data-ch="消" style="--i:3"><b>消</b></span><span class="ch" data-ch="樂" style="--i:4"><b>樂</b></span></span></h1>
      <!-- 貼紙照片（assets/deco/）：檔案不在就整個拿掉，不留空位 -->
      <div class="load-deco" aria-hidden="true"><img src="assets/deco/sloth_orange.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></div>
      <div class="loadbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="載入進度"><div class="loadbar-fill" id="load-fill"></div></div>
      <p class="load-text" id="load-text">毛絨玩具準備中…</p>
    </div>
  </section>

  <!-- 標題 -->
  <section id="scr-title" class="screen" aria-label="標題畫面">
    <!-- 角落的貼紙（主人的玩具照片去背）：在內容後面輕輕搖；圖不在就拿掉 -->
    <span class="title-stk stk-pig" aria-hidden="true"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
    <span class="title-stk stk-snoopy" aria-hidden="true"><img src="assets/deco/snoopy_sloth.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
    <div class="topbar">
      <!-- 雲端存檔（設定了 js/cloud-config.js 才會出現）：沒登入是「登入存檔」，登入後是頭像＋名字；按了打開設定 -->
      <button class="acct-chip" id="acct-chip" type="button" hidden><span class="acct-av" aria-hidden="true"></span><span class="acct-nm"></span></button>
      <span class="spacer"></span>
      <button class="icon-btn" data-open-settings aria-label="設定"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div class="title-main">
      <!-- 直式：兩個包裝都是 display:contents（一欄排下來）；橫式手機：左欄標題、右欄玩具＋按鈕 -->
      <div class="title-head">
        <h1 class="logo" aria-label="毛絨消消樂"><span class="logo-row" aria-hidden="true"><span class="ch" data-ch="毛" style="--i:0"><b>毛</b></span><span class="ch" data-ch="絨" style="--i:1"><b>絨</b></span><span class="ch" data-ch="消" style="--i:2"><b>消</b></span><span class="ch" data-ch="消" style="--i:3"><b>消</b></span><span class="ch" data-ch="樂" style="--i:4"><b>樂</b></span></span></h1>
        <!-- 名字順序 = 下面玩具由左到右的順序（皮蛋、薯餅在中間、蛋黃哥） -->
        <p class="logo-sub" aria-label="主角：皮蛋、薯餅、蛋黃哥"><span>皮蛋</span><i>・</i><span>薯餅</span><i>・</i><span>蛋黃哥</span></p>
        <p class="tagline">3D 掃描毛絨玩具的三消冒險</p>
      </div>
      <div class="title-play">
        <div class="title-toys" id="title-toys"></div>
        <div class="title-btns">
          <button class="btn green xl" id="btn-start"><svg class="bi"><use href="#i-play"/></svg><span class="bt" data-t="開始遊戲">開始遊戲</span></button>
          <a class="btn pink" id="btn-ar" href="ar.html"><svg class="bi"><use href="#i-cube"/></svg><span class="bt" data-t="3D 看看">3D 看看</span></a>
        </div>
      </div>
    </div>
  </section>

  <!-- 關卡地圖 -->
  <section id="scr-map" class="screen" aria-label="關卡地圖">
    <div class="topbar">
      <button class="icon-btn" id="map-back" aria-label="回到標題"><svg><use href="#i-back"/></svg></button>
      <button class="icon-btn" data-open-settings aria-label="設定"><svg><use href="#i-gear"/></svg></button>
    </div>
    <div class="map-scroll" id="map-scroll">
      <div class="map-inner" id="map-inner"></div>
      <!-- 地圖貼紙：高度 0 的一層貼在地圖最底下，用 bottom 往上量（第 1 關固定在離底 110px、每關 116px，跟 main.js 的 MAP_BOTTOM / MAP_GAP 一樣）。
           --u = 第幾關的高度（0 = 第 1 關）、--x = 橫向位置；都放在路的旁邊空地，站在小雲台上（有往右下的影子），畫在路上面、關卡按鈕下面 -->
      <div class="map-deco" aria-hidden="true">
        <span class="md md-s" style="--u:.12;--x:86%;--k:0"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:1.45;--x:19%;--k:1"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:3.9;--x:82%;--k:2"><img src="assets/deco/sloth_pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:5.5;--x:12%;--k:3"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:7.45;--x:18%;--k:4"><img src="assets/deco/sloth_orange.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-t" style="--u:9.9;--x:82%;--k:5"><img src="assets/deco/snoopy_sloth.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:11.5;--x:12%;--k:6"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:13.45;--x:19%;--k:7"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <!-- 第 16 關以後：路每 6 關繞回同一邊，所以照上面的位置重複（換不同的貼紙） -->
        <span class="md md-m" style="--u:15.9;--x:82%;--k:8"><img src="assets/deco/group.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:17.5;--x:12%;--k:9"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:19.45;--x:18%;--k:10"><img src="assets/deco/sloth_pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-t" style="--u:21.9;--x:82%;--k:11"><img src="assets/deco/snoopy_sloth.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:23.5;--x:12%;--k:12"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:25.45;--x:19%;--k:13"><img src="assets/deco/sloth_orange.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:27.9;--x:82%;--k:14"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <!-- 第 31–60 關：同樣每 6 關一輪的位置，貼紙輪流換 -->
        <span class="md md-s" style="--u:29.5;--x:12%;--k:15"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:31.45;--x:19%;--k:16"><img src="assets/deco/sloth_orange.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:33.9;--x:82%;--k:17"><img src="assets/deco/group.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:35.5;--x:12%;--k:18"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:37.45;--x:19%;--k:19"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-t" style="--u:39.9;--x:82%;--k:20"><img src="assets/deco/snoopy_sloth.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:41.5;--x:12%;--k:21"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:43.45;--x:19%;--k:22"><img src="assets/deco/sloth_pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:45.9;--x:82%;--k:23"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:47.5;--x:12%;--k:24"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:49.45;--x:19%;--k:25"><img src="assets/deco/sloth_orange.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:51.9;--x:82%;--k:26"><img src="assets/deco/group.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:53.5;--x:12%;--k:27"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:55.45;--x:19%;--k:28"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-t" style="--u:57.9;--x:82%;--k:29"><img src="assets/deco/snoopy_sloth.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <!-- 第 61–100 關：一樣每 6 關一輪 -->
        <span class="md md-s" style="--u:59.50;--x:12%;--k:30"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:61.45;--x:19%;--k:31"><img src="assets/deco/sloth_pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:63.90;--x:82%;--k:32"><img src="assets/deco/group.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:65.50;--x:12%;--k:33"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:67.45;--x:19%;--k:34"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-t" style="--u:69.90;--x:82%;--k:35"><img src="assets/deco/snoopy_sloth.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:71.50;--x:12%;--k:36"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:73.45;--x:19%;--k:37"><img src="assets/deco/sloth_orange.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:75.90;--x:82%;--k:38"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:77.50;--x:12%;--k:39"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:79.45;--x:19%;--k:40"><img src="assets/deco/sloth_pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:81.90;--x:82%;--k:41"><img src="assets/deco/group.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:83.50;--x:12%;--k:42"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:85.45;--x:19%;--k:43"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-t" style="--u:87.90;--x:82%;--k:44"><img src="assets/deco/snoopy_sloth.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:89.50;--x:12%;--k:45"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:91.45;--x:19%;--k:46"><img src="assets/deco/sloth_orange.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-l" style="--u:93.90;--x:82%;--k:47"><img src="assets/deco/sloth_bed.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-s" style="--u:95.50;--x:12%;--k:48"><img src="assets/deco/pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
        <span class="md md-m" style="--u:97.45;--x:19%;--k:49"><img src="assets/deco/sloth_pig.webp" alt="" decoding="async" onerror="this.parentNode.remove()"></span>
      </div>
    </div>
    <!-- 底部固定列（76px）：頭像（點了捲回目前關卡）、造型幣、星星、玩偶衣櫃。是地圖下面的一列，不疊在地圖上，第 1 關不會被蓋住 -->
    <div class="map-dock">
      <button class="dk-me" id="dk-me" type="button" aria-label="回到目前的關卡"><span class="dk-ava" id="dk-ava"></span></button>
      <div class="dk-stats">
        <span class="dk-stat dk-coins" aria-label="造型幣"><i class="coin"></i><b id="cf-coins" data-t="0">0</b></span>
        <span class="dk-stat star-pill" aria-label="星星總數"><svg class="pill-star"><use href="#i-star"/></svg><b id="map-stars" data-t="0">0</b><span id="map-stars-max">/ 0</span></span>
      </div>
      <!-- 玩偶衣櫃（三星外觀獎勵）：有寶箱可以開時亮紅點、輕輕晃 -->
      <button class="closet-fab" id="btn-closet" type="button" aria-label="玩偶衣櫃（換裝）">
        <span class="cf-icon" aria-hidden="true"><svg><use href="#i-hanger"/></svg></span>
        <span class="cf-label">衣櫃</span>
        <span class="cf-dot" id="cf-dot" hidden></span>
      </button>
    </div>
  </section>

  <!-- 遊戲 -->
  <section id="scr-game" class="screen" aria-label="遊戲">
    <div class="topbar game-top">
      <!-- 改版 2026-11：暫停鈕和「第 N 關」合成一顆白色膠囊（.lv-cap） -->
      <div class="lv-cap">
        <button class="icon-btn" id="btn-pause" aria-label="暫停"><svg><use href="#i-pause"/></svg></button>
        <!-- .lv：字的立體厚度用 filter 做，包一層才不會連牌子的底色一起複製 -->
        <div class="pill level-pill"><span class="lv">第 <b id="hud-level" data-t="1">1</b> 關</span></div>
      </div>
      <button class="icon-btn dbg" id="btn-dbg-win" aria-label="測試：直接過關" hidden>⚡</button>
    </div>
    <div class="hud">
      <div class="hud-moves" id="hud-moves-box">
        <span class="lbl">步數</span>
        <b id="hud-moves" data-t="0">0</b>
      </div>
      <div class="hud-goal">
        <span class="lbl">目標</span>
        <div class="goal-items" id="hud-goal"></div>
      </div>
      <div class="hud-score">
        <div class="score-line"><span class="lbl">分數</span><b id="hud-score" data-t="0">0</b></div>
        <div class="starbar" id="starbar">
          <div class="starbar-track"><div class="starbar-fill" id="starbar-fill"></div></div>
          <svg class="sb-star" style="--p:33.3%"><use href="#i-star"/><use class="hi" href="#i-star-hi"/></svg>
          <svg class="sb-star" style="--p:66.6%"><use href="#i-star"/><use class="hi" href="#i-star-hi"/></svg>
          <svg class="sb-star" style="--p:97%"><use href="#i-star"/><use class="hi" href="#i-star-hi"/></svg>
        </div>
      </div>
    </div>
    <div class="board-wrap" id="board-wrap">
      <canvas id="board" aria-label="遊戲盤面：按住方塊拖向旁邊，或先後點兩個相鄰方塊來交換"></canvas>
    </div>
    <div class="cheer" id="cheer" aria-hidden="true"></div>
    <!-- 道具列（像 Candy Crush 下面那排）：都不算步數 -->
    <div class="booster-tip" id="booster-tip" aria-live="polite" hidden></div>
    <div class="boosters" id="boosters" role="toolbar" aria-label="道具">
      <button class="bst" type="button" data-b="hammer" aria-label="棒棒糖槌：敲掉一顆"><span class="bi" aria-hidden="true">🍭</span><b class="bc">0</b><span class="bn">槌子</span></button>
      <button class="bst" type="button" data-b="swap" aria-label="自由交換：相鄰兩顆隨便換"><span class="bi" aria-hidden="true">✋</span><b class="bc">0</b><span class="bn">交換</span></button>
      <button class="bst" type="button" data-b="ufo" aria-label="薯餅空投：三顆包裝糖果一起爆"><span class="bi" aria-hidden="true">🛸</span><b class="bc">0</b><span class="bn">空投</span></button>
    </div>
  </section>
</div>

<!-- 關卡開始卡 -->
<div class="modal" id="m-start" role="dialog" aria-modal="true" aria-labelledby="ms-title" aria-hidden="true">
  <div class="card start-card">
    <button class="icon-btn close" data-close aria-label="關閉"><svg><use href="#i-close"/></svg></button>
    <div class="ribbon"><span id="ms-title">第 1 關</span></div>
    <div class="card-stars" id="ms-stars"></div>
    <div class="goal-box">
      <div class="goal-box-lbl">目標</div>
      <!-- 改版 2026-11：目標只寫一次（圖示旁邊的大數字），下面重複的「收集 XX ×30」拿掉；完整的一句放在 aria-label -->
      <div class="goal-big" id="ms-goal" role="group"></div>
    </div>
    <div class="moves-line">有 <b id="ms-moves" data-t="20">20</b> 步可以用</div>
    <div class="hint-bubble" id="ms-hint-box">
      <span class="hint-avatar" id="ms-avatar"></span>
      <p id="ms-hint"></p>
    </div>
    <button class="btn green xl" id="ms-play"><svg class="bi"><use href="#i-play"/></svg><span class="bt" data-t="開始！">開始！</span></button>
  </div>
</div>

<!-- 新機關教學小卡：第一次遇到某種機關時（main.js showIntros），點一下就開始 -->
<div class="modal" id="m-intro" role="dialog" aria-modal="true" aria-labelledby="mi-title" aria-hidden="true">
  <div class="card intro-card">
    <div class="ribbon"><span id="mi-ribbon">新機關！</span></div>
    <div class="intro-icon" id="mi-icon"></div>
    <div class="intro-title" id="mi-title"></div>
    <p class="intro-text" id="mi-text"></p>
    <div class="intro-tap" id="mi-tap">點一下開始</div>
  </div>
</div>

<!-- 過關 -->
<div class="modal" id="m-win" role="dialog" aria-modal="true" aria-labelledby="mw-title" aria-hidden="true">
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="card win-card">
    <!-- main.js 設 src（隨機一張貼紙照片）；沒有 src 或載入失敗就不顯示（不能 remove，下一關還要用） -->
    <img id="mw-photo" class="modal-photo" alt="" decoding="async" onload="this.classList.remove('broken')" onerror="this.classList.add('broken')">
    <div class="ribbon"><span id="mw-title">過關！</span></div>
    <!-- 改版 2026-11：緞帶和貼紙照片留在卡片外框，其他內容放進 .win-body；螢幕太矮時只有 .win-body 在卡片裡捲動，緞帶永遠看得到 -->
    <div class="win-body" id="mw-body">
    <div class="big-stars" id="mw-stars" aria-label="得到星星">
      <svg class="bs" style="--k:0"><use href="#i-star"/></svg>
      <svg class="bs" style="--k:1"><use href="#i-star"/></svg>
      <svg class="bs" style="--k:2"><use href="#i-star"/></svg>
    </div>
    <div class="score-box">
      <span class="lbl">分數</span>
      <b id="mw-score" data-t="0">0</b>
      <em id="mw-best" hidden>新紀錄！</em>
      <span class="best-line" id="mw-best-line"></span>
    </div>
    <!-- 獲得的道具和「三星造型幣 +1」排在同一排小膠囊（main.js showWin 填），放不下就換第二行 -->
    <div class="mw-reward" id="mw-reward" hidden></div>
    <div class="modal-toys" id="mw-toys"></div>
    <div class="btn-col">
      <button class="btn green xl" id="mw-next"><span class="bt" data-t="下一關">下一關</span></button>
      <div class="btn-row">
        <button class="btn blue" id="mw-retry">再玩一次</button>
        <button class="btn pink" id="mw-map">地圖</button>
      </div>
      <button class="link-btn" id="mw-closet" type="button"><svg><use href="#i-hanger"/></svg>玩偶衣櫃<small class="lb-tag" id="mw-closet-tag" hidden>開寶箱</small><span class="lb-dot" id="mw-closet-dot" hidden></span></button>
    </div>
    </div>
  </div>
</div>

<!-- 失敗 -->
<div class="modal" id="m-lose" role="dialog" aria-modal="true" aria-labelledby="ml-title" aria-hidden="true">
  <div class="card lose-card">
    <div class="ribbon sad"><span id="ml-title">步數用完了</span></div>
    <!-- main.js 設 src（薯餅趴趴睡）；有照片時就不顯示下面那排難過的玩具 -->
    <img id="ml-photo" class="modal-photo" alt="" decoding="async" onload="this.classList.remove('broken')" onerror="this.classList.add('broken')">
    <div class="modal-toys sad" id="ml-toys"></div>
    <p class="lose-text" id="ml-text"></p>
    <div class="btn-col">
      <button class="btn orange" id="ml-more" hidden>＋5 步繼續（剩 <b id="ml-more-n">0</b> 個）</button>
      <button class="btn green xl" id="ml-retry"><span class="bt" data-t="再試一次">再試一次</span></button>
      <button class="btn pink" id="ml-map">地圖</button>
    </div>
  </div>
</div>

<!-- 玩偶衣櫃（三星外觀獎勵）：上面是即時預覽的小盤面，下面四個分類、寶箱 -->
<div class="modal" id="m-closet" role="dialog" aria-modal="true" aria-labelledby="cl-title" aria-hidden="true">
  <div class="card closet-card">
    <div class="ribbon"><span id="cl-title">玩偶衣櫃</span></div>
    <button class="icon-btn close" data-close aria-label="關閉" type="button"><svg><use href="#i-close"/></svg></button>
    <div class="cl-scroll">
    <!-- 有寶箱可以開時才出現，點了捲到寶箱區（改版 2026-11） -->
    <button class="cl-ready" id="cl-ready" type="button" hidden></button>
    <div class="cl-wallet">
      <span class="cl-chip"><i class="coin"></i><b id="cl-coins">0</b><small>三星造型幣</small></span>
      <span class="cl-chip"><svg class="cl-star"><use href="#i-star"/></svg><b id="cl-stars">0</b><small id="cl-stars-max">/ 0</small></span>
    </div>
    <div class="cl-preview">
      <canvas id="cl-board" aria-label="外觀預覽"></canvas>
      <span class="cl-try" id="cl-try" hidden>試穿中</span>
      <button class="cl-demo" id="cl-demo" type="button">試試消除特效</button>
    </div>
    <div class="cl-tabs" id="cl-tabs" role="tablist" aria-label="分類"></div>
    <div class="cl-grid" id="cl-grid" role="tabpanel"></div>
    <div class="cl-sub" id="cl-chest-sec">三星豪華寶箱<small>星星總數到了就能開</small></div>
    <div class="cl-chests" id="cl-chests"></div>
    <p class="cl-help">每一關<b>第一次拿到三星</b>送 1 枚三星造型幣</p>
    </div>
    <!-- 開寶箱的動畫 -->
    <div class="cl-pop" id="cl-pop" hidden>
      <div class="cp-box">
        <div class="cp-chest" id="cp-chest" aria-hidden="true"></div>
        <div class="cp-items" id="cp-items"></div>
        <p class="cp-text" id="cp-text"></p>
        <button class="btn green" id="cp-ok" type="button"><span class="bt" data-t="太棒了！">太棒了！</span></button>
      </div>
    </div>
  </div>
</div>

<!-- 設定 / 暫停 -->
<div class="modal sheet" id="m-settings" role="dialog" aria-modal="true" aria-labelledby="set-title" aria-hidden="true">
  <div class="card sheet-card">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="set-title">設定</h2>
    <!-- 帳號（雲端存檔）：遊戲中暫停時不顯示 -->
    <div class="acct" id="acct-box" hidden>
      <div class="acct-row">
        <span class="acct-av" aria-hidden="true"></span>
        <div class="acct-text"><b id="acct-name">還沒登入</b><small id="acct-sub"></small></div>
        <button class="acct-out" id="acct-out" type="button" hidden>登出</button>
      </div>
      <div class="acct-btns" id="acct-btns" hidden>
        <button class="btn pink" id="acct-pw" type="button"><span class="bt" data-t="帳號密碼">帳號密碼</span></button>
      </div>
    </div>
    <div class="toggles">
      <button class="toggle" id="tg-sound" aria-pressed="true"><svg class="ti"><use href="#i-sound"/></svg><span class="tl">音效</span><span class="sw" aria-hidden="true"><i></i></span></button>
      <button class="toggle" id="tg-music" aria-pressed="true"><svg class="ti"><use href="#i-music"/></svg><span class="tl">音樂</span><span class="sw" aria-hidden="true"><i></i></span></button>
    </div>
    <div class="sheet-actions">
      <button class="btn blue" id="set-map">回到地圖</button>
      <button class="btn orange" id="set-restart">重新開始</button>
      <button class="btn green" id="set-close">繼續</button>
    </div>
  </div>
</div>

<!-- 帳號名稱＋密碼：登入 / 開新帳號（不用 email，LINE 裡也能用） -->
<div class="modal" id="m-login" role="dialog" aria-modal="true" aria-labelledby="lg-title" aria-hidden="true">
  <div class="card login-card">
    <button class="icon-btn close" data-close aria-label="關閉" type="button"><svg><use href="#i-close"/></svg></button>
    <div class="ribbon"><span id="lg-title">登入帳號</span></div>
    <form class="login-form" id="lg-form" novalidate>
      <label class="fld"><span>帳號名稱</span><input id="lg-name" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="24" placeholder="例如：小明、alice" enterkeyhint="next"></label>
      <label class="fld"><span>密碼</span><input id="lg-pass" type="password" autocomplete="current-password" placeholder="至少 6 個字" enterkeyhint="go"></label>
      <label class="fld" id="lg-pass2-row" hidden><span>再輸入一次密碼</span><input id="lg-pass2" type="password" autocomplete="new-password" placeholder="跟上面一樣" enterkeyhint="go"></label>
      <label class="lg-show"><input type="checkbox" id="lg-show"> 顯示密碼</label>
      <p class="lg-err" id="lg-err" role="alert"></p>
      <button class="btn green" id="lg-submit" type="submit"><span class="bt" data-t="登入">登入</span></button>
      <button class="lg-switch" id="lg-switch" type="button">還沒有帳號？開一個新的</button>
      <p class="lg-note">名字和密碼請記好：忘記密碼沒辦法自己找回來。</p>
    </form>
  </div>
</div>

<!-- 登入時：這台裝置上有沒登入時玩的進度，問要不要帶進帳號 -->
<div class="modal" id="m-merge" role="dialog" aria-modal="true" aria-labelledby="mm-title" aria-hidden="true">
  <div class="card merge-card">
    <div class="ribbon"><span id="mm-title">帶進帳號？</span></div>
    <p class="merge-text" id="mm-text"></p>
    <div class="btn-col">
      <button class="btn green" id="mm-yes" type="button">帶進來</button>
      <button class="btn blue" id="mm-no" type="button">不用</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p class="fatal">這個遊戲需要開啟 JavaScript。</p></noscript>

<!-- 載入保險：主程式沒有啟動（例如用 file:// 直接開）就顯示說明 -->
<script>
  setTimeout(function () {
    if (window.__plushBooted) return;
    var t = document.getElementById('load-text');
    if (t) t.innerHTML = '載入失敗了 QQ<br><small>請用 http 伺服器開啟（在專案資料夾執行 python -m http.server 8000），然後重新整理。</small>';
    document.documentElement.classList.add('load-failed');
  }, 9000);
</script>
<!-- ?v=：改版上線時換日期，手機才不會拿到快取的舊檔（js/ 裡互相 import 的字串也要一起換，見 main.js 的 MOD_V） -->
<script type="module" src="js/main.js?v=20261123f"></script>
</body>
</html>
