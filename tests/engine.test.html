<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引擎測試 · 毛絨消消樂</title>
<style>
  :root { --bg: #fff7fb; --ink: #3b2a3f; --muted: #8a7a90; --ok: #2f9e6e; --bad: #d4405f; --card: #ffffff; }
  body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "Baloo 2", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--muted); }
  #sum { font-weight: 700; font-size: 16px; margin: 10px 0; }
  #sum.pass { color: var(--ok); } #sum.fail { color: var(--bad); }
  ul { list-style: none; padding: 0; margin: 0; background: var(--card); border-radius: 14px;
    box-shadow: 0 2px 10px rgba(80, 30, 70, .08); overflow: hidden; }
  li { padding: 7px 12px; border-bottom: 1px solid #f3e6ef; white-space: pre-wrap; word-break: break-word; }
  li.pass { color: var(--ok); } li.fail { color: var(--bad); background: #fff0f3; }
  li span { color: var(--muted); font-size: 12px; }
  pre#notes { color: var(--muted); white-space: pre-wrap; margin-top: 14px; }
</style>
</head>
<body>
<h1>毛絨消消樂 · 引擎測試</h1>
<p class="sub">js/engine.js — 規則、特殊方塊、組合技、掉落、計分、事件與隨機壓力測試</p>
<div id="sum">執行中…</div>
<ul id="out"></ul>
<pre id="notes"></pre>
<script type="module" src="engine.test.js"></script>
</body>
</html>
