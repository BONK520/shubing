<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7c4e6">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="毛絨消消樂的 3D 毛絨玩具：拖曳轉一轉、兩指放大，近近地看每一隻">
<title>3D 看看 · 毛絨消消樂</title>
<link rel="icon" href="assets/sprites/sloth.png">
<link rel="stylesheet" href="ar.css">
<script>
  // 3D 檢視器載不到（沒網路）或在這個瀏覽器跑不起來時：在 <html> 做記號、通知頁面程式（只做一次）
  function mvFail(kind) {
    var h = document.documentElement;
    if (h.classList.contains('mv-failed') || (window.customElements && customElements.get('model-viewer'))) return;
    h.setAttribute('data-mv-fail', kind);
    h.classList.add('mv-failed');
    try { window.dispatchEvent(new Event('mv-failed')); } catch (e) { /* 很舊的瀏覽器 */ }
  }
  window.addEventListener('error', function (e) {
    if (e && e.filename && e.filename.indexOf('/@google/model-viewer@') >= 0) mvFail('js');
  });
</script>
<!-- 只有這一頁可以用 CDN：@google/model-viewer，鎖定版本。
     async：CDN 很慢或連不上時，選單、資訊卡和說明照樣先出來，不必等它 -->
<script type="module" async src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.2.0/dist/model-viewer.min.js"
        onerror="mvFail('net')"></script>
</head>
<body>

<div class="sky" aria-hidden="true">
  <i class="puff p1"></i><i class="puff p2"></i><i class="puff p3"></i>
  <i class="twinkle t1"></i><i class="twinkle t2"></i><i class="twinkle t3"></i><i class="twinkle t4"></i><i class="twinkle t5"></i>
</div>

<header class="top">
  <a class="back" href="index.html">← 回到遊戲</a>
  <div class="title">
    <h1>3D 看看</h1>
    <p>轉一轉、放大看，每一隻都看清楚！</p>
  </div>
</header>

<main class="layout">
  <section class="stage" id="stage" aria-label="3D 檢視">
    <div class="stage-glow" id="glow" aria-hidden="true"></div>
    <model-viewer id="mv"
      camera-controls
      touch-action="pan-y"
      auto-rotate auto-rotate-delay="2500" rotation-per-second="16deg"
      interaction-prompt="none"
      camera-orbit="20deg 75deg 125%"
      min-camera-orbit="auto 10deg 45%" max-camera-orbit="auto 100deg 260%"
      shadow-intensity="1.1" shadow-softness="0.85"
      environment-image="neutral" exposure="1.05" tone-mapping="neutral"
      interpolation-decay="110"
      alt="可以旋轉的 3D 毛絨玩具">
      <div slot="progress-bar" class="progress" id="progress" aria-hidden="true"><span></span></div>
    </model-viewer>

    <div class="chip" id="chip">
      <span class="dot" id="chipDot"></span>
      <span id="chipName">毛絨</span>
      <span class="tag" id="chipTag">真實掃描</span>
    </div>

    <button class="nav prev" id="prev" type="button" aria-label="上一隻">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav next" id="next" type="button" aria-label="下一隻">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="loading" id="loading" aria-hidden="true">
      <div class="loading-face" id="loadingFace"></div>
      <p id="loadingText">毛絨正在跑過來…</p>
    </div>

    <div class="fail" id="fail" hidden>
      <div class="fail-face" id="failFace"></div>
      <p id="failText">模型還在路上，等一下再來看看！</p>
    </div>
  </section>

  <aside class="side">
    <section class="info card" aria-live="polite">
      <div class="info-head">
        <h2 id="name">毛絨</h2>
        <span class="badge" id="badge">真實掃描</span>
      </div>
      <!-- 說明放在資訊卡（不放在舞台上，免得蓋到高的毛絨，例如兔兔的耳朵）；兩種說明一樣高，切換時下面的選單不會跳 -->
      <p class="model-note scan-note" id="scanNote">用 3D 掃描真的毛絨玩具做成的！</p>
      <p class="model-note placeholder-note" id="placeholderNote" hidden>這是暫代模型，之後會換成真的掃描</p>
      <p class="size" id="size">量尺寸中…</p>
      <ul class="tips">
        <li><b>拖曳</b>轉一轉</li>
        <li><b>兩指</b>放大縮小</li>
        <li><b>左右</b>換一隻</li>
      </ul>
    </section>

    <nav class="picker card" aria-label="選一隻毛絨">
      <h3>選一隻毛絨</h3>
      <div class="grid" id="picker" role="tablist"></div>
    </nav>
  </aside>
</main>

<script type="module">
import { PIECES, spritePath, glbPath } from './js/pieces.js';

const $ = id => document.getElementById(id);
const mv = $('mv');
const html = document.documentElement;

// 3D 檢視器（model-viewer，從 CDN 用 async 載入，可能比這段程式晚到）的狀態：
// wait 還在載、ok 可以用、slow 等了 12 秒還沒好（繼續等，載到就自動恢復）、net 載不到（沒網路）、js 這個瀏覽器跑不起來
let viewer = customElements.get('model-viewer') ? 'ok' : 'wait';
const LOADING_TEXT = '毛絨正在跑過來…';
const VIEWER_TEXT = {
  slow: '網路有點慢，3D 檢視器還在路上…',
  net: '3D 檢視器要連上網路才能打開喔！',
  js: '這個瀏覽器打不開 3D 檢視器，換一個試試看？',
};
const viewerBroken = () => viewer === 'net' || viewer === 'js';
// 依檢視器狀態畫舞台：打不開就一直顯示說明（切換毛絨也一樣），不然就照 loading 顯示載入中
function paintStage(loading) {
  const broken = viewerBroken();
  $('stage').classList.toggle('is-loading', !!loading && !broken);
  $('fail').hidden = !broken;
  if (broken) {
    $('failText').textContent = VIEWER_TEXT[viewer];
    $('size').textContent = '';
  }
  $('loadingText').textContent = viewer === 'slow' ? VIEWER_TEXT.slow : LOADING_TEXT;
}
function setViewer(state) {
  if (state === viewer || viewer === 'ok') return;
  if (state === 'slow' && viewer !== 'wait') return;
  viewer = state;
  paintStage(!mv.loaded);
}

// 測試用：?models=tools/out/models/ 改用別的模型資料夾（只接受同網站的相對路徑）
const params = new URLSearchParams(location.search);
const modelsDir = (() => {
  const v = params.get('models');
  if (!v || /[:\\]|^\/\//.test(v) || !/^[\w\-./]+$/.test(v)) return null;
  return v.endsWith('/') ? v : v + '/';
})();
// 每隻的最佳初始視角（和 tools/render 的 yaw/pitch 同一套座標：yaw = model-viewer 的 theta）。
// 只是微調用的提示；沒列到的 id（例如之後新增的掃描）就用預設值。assets/manifest.json 若有 view 欄位會優先使用。
const VIEW_DEFAULT = { yaw: 20, pitch: 15, exposure: 1.05 };
const VIEW = {
  dog:     { yaw: 300, pitch: 22, exposure: 1.6 },   // 黑色毛很暗，曝光拉高
  sloth:   { yaw: 10,  pitch: 12, exposure: 1.1 },
  egg:     { yaw: 10,  pitch: 12, exposure: 1.0 },
  moodeng: { yaw: 30,  pitch: 14 },                  // 斜前方：看得到張開的嘴和圓滾滾的身體
};
const manifestViews = {};
fetch('assets/manifest.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(m => {
  (m && m.pieces || []).forEach(e => { if (e && e.id && e.view) manifestViews[e.id] = e.view; });
}).catch(() => { /* 沒有 manifest 就用上面的預設視角 */ });
const viewOf = id => Object.assign({}, VIEW_DEFAULT, VIEW[id] || {}, manifestViews[id] || {});
// model-viewer 只在數值有變時才更新相機，所以每次載入都讓半徑差一點點，確保會重設視角
let orbitFlip = false;
const orbitOf = v => `${v.yaw}deg ${90 - v.pitch}deg ${(orbitFlip = !orbitFlip) ? 125 : 125.01}%`;

const glbOf = id => modelsDir ? `${modelsDir}${id}.glb` : glbPath(id);

// 小圖：貼紙圖，載入失敗就畫一個彩色圓圈 + 名字第一個字
function face(p, cls = '') {
  const el = document.createElement('span');
  el.className = 'face ' + cls;
  el.style.setProperty('--c', p.color);
  const img = new Image();
  img.alt = '';
  img.decoding = 'async';
  img.draggable = false;
  img.onerror = () => { img.remove(); el.classList.add('no-img'); el.textContent = p.name.slice(0, 1); };
  img.src = spritePath(p.id);
  el.appendChild(img);
  return el;
}

// 選單
const picker = $('picker');
const cards = PIECES.map((p, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'toy';
  b.setAttribute('role', 'tab');
  b.style.setProperty('--c', p.color);
  b.dataset.id = p.id;
  b.appendChild(face(p));
  const n = document.createElement('span');
  n.className = 'toy-name';
  n.textContent = p.name;
  b.appendChild(n);
  const t = document.createElement('span');
  t.className = 'toy-tag' + (p.scan ? '' : ' temp');
  t.textContent = p.scan ? '掃描' : '暫代';
  b.appendChild(t);
  b.addEventListener('click', () => select(i, true));
  picker.appendChild(b);
  return b;
});

let current = -1;

function setFaces(p) {
  for (const id of ['loadingFace', 'failFace']) {
    const box = $(id);
    box.replaceChildren(face(p, 'big'));
  }
}

function select(i, user) {
  i = (i + PIECES.length) % PIECES.length;
  if (i === current) return;
  current = i;
  const p = PIECES[i];
  cards.forEach((c, k) => {
    c.classList.toggle('on', k === i);
    c.setAttribute('aria-selected', k === i ? 'true' : 'false');
  });
  if (user) cards[i].scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  document.documentElement.style.setProperty('--toy', p.color);
  $('chipDot').style.background = p.color;
  $('chipName').textContent = p.name;
  $('chipTag').textContent = p.scan ? '真實掃描' : '暫代模型';
  $('chipTag').classList.toggle('temp', !p.scan);
  $('name').textContent = p.name;
  $('badge').textContent = p.scan ? '真實掃描' : '暫代模型';
  $('badge').classList.toggle('temp', !p.scan);
  $('placeholderNote').hidden = p.scan;
  $('scanNote').hidden = !p.scan;
  $('size').textContent = '量尺寸中…';
  setFaces(p);
  $('stage').classList.add('switching');
  paintStage(true);
  setTimeout(() => $('stage').classList.remove('switching'), 450);
  try { history.replaceState(null, '', location.pathname + location.search + '#' + p.id); } catch (e) { /* ignore */ }

  // 用屬性設定：檢視器還沒載好（元素還沒升級）時也一定有效，載好後會照著讀
  mv.setAttribute('alt', `${p.name}的 3D 模型，可以旋轉和放大`);
  mv.setAttribute('exposure', String(viewOf(p.id).exposure));
  mv.setAttribute('src', glbOf(p.id));
}

function fmt(m) { return Math.max(1, Math.round(m * 100)); }

mv.addEventListener('load', () => {
  $('stage').classList.remove('is-loading');
  $('fail').hidden = true;
  try {
    const d = mv.getDimensions();
    $('size').textContent = `大約 寬 ${fmt(d.x)} × 高 ${fmt(d.y)} × 深 ${fmt(d.z)} 公分`;
  } catch (e) { $('size').textContent = ''; }
  // 新模型載入後才設定視角（載入前設定會被忽略）；對準模型中心
  try {
    const p = PIECES[current];
    mv.cameraOrbit = orbitOf(viewOf(p.id));
    const c = mv.getBoundingBoxCenter();
    mv.cameraTarget = `${c.x}m ${c.y}m ${c.z}m`;
  } catch (e) { /* ignore */ }
  try { mv.resetTurntableRotation && mv.resetTurntableRotation(); } catch (e) { /* ignore */ }
  Promise.resolve(mv.updateComplete).then(() => requestAnimationFrame(() => {
    try { mv.jumpCameraToGoal && mv.jumpCameraToGoal(); } catch (e) { /* ignore */ }
  }));
});

mv.addEventListener('error', ev => {
  if (ev.detail && ev.detail.type && ev.detail.type !== 'loadfailure') return;
  $('stage').classList.remove('is-loading');
  $('fail').hidden = false;
  $('failText').textContent = '模型還在路上，等一下再來看看！';
  $('size').textContent = '';
});

mv.addEventListener('progress', ev => {
  const v = ev.detail && ev.detail.totalProgress;
  $('progress').style.setProperty('--p', String(v || 0));
  $('progress').classList.toggle('done', v >= 1);
});

$('prev').addEventListener('click', () => select(current - 1, true));
$('next').addEventListener('click', () => select(current + 1, true));
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') select(current - 1, true);
  if (e.key === 'ArrowRight') select(current + 1, true);
});
window.addEventListener('hashchange', () => {
  const k = PIECES.findIndex(p => p.id === location.hash.slice(1));
  if (k >= 0) select(k, false);
});

// 檢視器載不到 / 跑不起來：<head> 裡的 mvFail() 會加上 mv-failed 並發出 mv-failed 事件（可能在這段程式之前或之後）
const failKind = () => (html.getAttribute('data-mv-fail') === 'js' ? 'js' : 'net');
if (html.classList.contains('mv-failed')) setViewer(failKind());
window.addEventListener('mv-failed', () => setViewer(failKind()));
// 12 秒還沒好：只換成「網路有點慢」的提示，繼續等；之後載到了照樣可以用
setTimeout(() => { if (viewer === 'wait') setViewer('slow'); }, 12000);
customElements.whenDefined('model-viewer').then(() => {
  setViewer('ok');
  html.classList.remove('mv-failed');
  html.classList.add('mv-ready');
});

const start = Math.max(0, PIECES.findIndex(p => p.id === location.hash.slice(1)));
select(start, false);
</script>
</body>
</html>
